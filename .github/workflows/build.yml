name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make mingw-w64-x86_64-gcc mingw-w64-x86_64-meson mingw-w64-x86_64-pkgconf mingw-w64-x86_64-nasm
      - name: Build corresponding audio component
        shell: msys2 {0}
        run: bash scripts/build-media.sh "$PWD/build/media-work"
      - name: Synthetic tests and release assembly
        shell: powershell
        run: |
          ./scripts/Test.ps1 -SkipPlayback
          ./scripts/Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: QingDu-release
          path: dist/*
# No cloud API secrets, vendor requests or automatic GitHub publishing.
